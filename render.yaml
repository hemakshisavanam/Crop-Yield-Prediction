services:
  - type: web
    name: agrisense-crop-yield
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python model/train_model.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
