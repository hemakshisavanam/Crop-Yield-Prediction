{% extends "base.html" %}

{% block title %}Log In — AgriSense{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="glass-card shadow-lg">
        
        <div class="text-center mb-4">
          <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
            <i class="fa-solid fa-seedling"></i>
          </div>
          <h3 class="fw-bold mb-1">Welcome Back</h3>
          <p class="text-muted small">Sign in to your AgriSense account to access your prediction history and personalized agronomy tools.</p>
        </div>

        <form action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST">
          
          <div class="agri-input-group">
            <label class="agri-label">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-envelope text-muted"></i></span>
              <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email | default(request.args.get('email', '')) }}" required>
            </div>
          </div>

          <div class="agri-input-group">
            <label class="agri-label">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn-agri btn-agri-primary w-100 py-3 mt-2 fs-6">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to AgriSense
          </button>

        </form>

        <div class="text-center mt-4 pt-3 border-top small">
          <span class="text-muted">Don't have an account yet?</span>
          <a href="{{ url_for('signup') }}" class="fw-bold text-success ms-1">Create Account &rarr;</a>
        </div>

      </div>

    </div>
  </div>
</div>
{% endblock %}
